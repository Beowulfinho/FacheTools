<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D5A80">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tareas">
<title>Tareas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233D5A80'/%3E%3Cpath d='M16 8v3M16 21v3M8 16h3M21 16h3M11.5 11.5l2 2M18.5 18.5l2 2M20.5 11.5l-2 2M13.5 18.5l-2 2' stroke='%23F1EFE6' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%23F1EFE6' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --paper: #F1EFE6;
    --paper-2: #E4E1D2;
    --paper-3: #D8D4C0;
    --paper-raised: #FAF9F2;
    --ink: #1E2A28;
    --ink-soft: #56655F;
    --ink-faint: #8A9590;
    --accent: #3D5A80;
    --accent-ink: #F1EFE6;
    --accent-soft: #DCE5EF;
    --good: #3F7D4A;
    --good-soft: #E1EEE1;
    --warn: #A8710E;
    --warn-soft: #F3E7D0;
    --critical: #A83636;
    --critical-soft: #F3DEDE;
    --line: #C9C4AE;
    --shadow: 0 1px 2px rgba(30, 42, 40, 0.06), 0 4px 14px rgba(30, 42, 40, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131E1B;
      --paper-2: #1B2724;
      --paper-3: #24322E;
      --paper-raised: #1B2724;
      --ink: #E9EDE9;
      --ink-soft: #9FB0A9;
      --ink-faint: #647169;
      --accent: #7DA3D9;
      --accent-ink: #0C1917;
      --accent-soft: #1E2E3A;
      --good: #7BC688;
      --good-soft: #1F3323;
      --warn: #E1AC55;
      --warn-soft: #3A2E15;
      --critical: #E28080;
      --critical-soft: #3A2020;
      --line: #33413C;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(0, 0, 0, 0.25);
    }
  }

  :root[data-theme="dark"] {
    --paper: #131E1B;
    --paper-2: #1B2724;
    --paper-3: #24322E;
    --paper-raised: #1B2724;
    --ink: #E9EDE9;
    --ink-soft: #9FB0A9;
    --ink-faint: #647169;
    --accent: #7DA3D9;
    --accent-ink: #0C1917;
    --accent-soft: #1E2E3A;
    --good: #7BC688;
    --good-soft: #1F3323;
    --warn: #E1AC55;
    --warn-soft: #3A2E15;
    --critical: #E28080;
    --critical-soft: #3A2020;
    --line: #33413C;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font-family: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand .mark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 1px 6px;
    letter-spacing: 0.04em;
  }

  h1, h2 {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    color: var(--ink);
  }

  h1 { font-size: 26px; display: flex; align-items: center; gap: 10px; }
  .app-icon { display: inline-flex; flex: none; width: 24px; height: 24px; color: var(--accent); }
  .app-icon svg { width: 100%; height: 100%; }

  .clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ---------- Splash / auth (Supabase login, mesmo padrão do Finanças/Planes) ---------- */
  .splash {
    position: fixed; inset: 0; background: var(--paper); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.25s ease;
  }
  .splash.hide { opacity: 0; pointer-events: none; }
  .splash svg { width: 40px; height: 40px; color: var(--accent); }

  .auth-hero {
    max-width: 380px; margin: 60px auto; display: flex; flex-direction: column;
    align-items: center; gap: 12px; text-align: center;
  }
  .auth-hero h2 { font-size: 20px; }
  .auth-hero p { color: var(--ink-soft); font-size: 13.5px; margin: 0; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .field input {
    padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink); width: 100%; font-size: inherit;
  }
  .field-error { display: none; color: var(--critical); font-size: 12.5px; }
  .field-error.show { display: block; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 15px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink); font-weight: 700;
    font-family: 'Archivo', sans-serif; font-size: 13.5px; box-shadow: var(--shadow);
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); }

  .conn-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 16px;
  }
  .conn-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--ink-faint); flex: none; }
  .conn-dot.on { background: var(--good); }
  .conn-label { font-size: 12px; color: var(--ink-soft); }
  .btn-logout {
    background: none; border: none; color: var(--ink-faint); font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px; font-weight: 600; padding: 4px 6px; text-decoration: underline;
  }
  .btn-logout:hover { color: var(--ink); }

  .banner {
    padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .banner.show { display: block; }
  .banner.danger { background: var(--critical-soft); color: var(--critical); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }

  .stat {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .stat .n {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 24px;
    font-weight: 500;
    line-height: 1;
  }

  .stat.due .n { color: var(--critical); }
  .stat.done .n { color: var(--good); }

  .stat .label {
    margin-top: 6px;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }

  .capture {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }

  .capture-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .capture-row .prompt {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent);
    font-size: 15px;
    flex-shrink: 0;
  }

  input[type="text"], input[type="date"], select, textarea {
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
  }

  #title-input {
    flex: 1;
    min-width: 0;
    font-size: 15px;
  }

  .capture-opts {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .capture-opts select, .capture-opts input[type="date"] {
    font-size: 13px;
    padding: 6px 8px;
  }

  #notes-input {
    flex: 1;
    min-width: 160px;
    resize: none;
    font-size: 13px;
    height: 34px;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .add-btn {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.01em;
    border-radius: 7px;
    padding: 9px 16px;
    flex-shrink: 0;
    border: none;
    font-family: 'Archivo', sans-serif;
  }

  .add-btn:disabled { opacity: 0.5; cursor: default; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  .tab {
    background: none;
    border: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 8px 12px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  .tab .count {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-faint);
    margin-left: 4px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
  }

  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .status-btn {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--paper);
    position: relative;
  }

  .status-btn.doing {
    border-color: var(--accent);
    background: repeating-conic-gradient(var(--accent) 0deg 180deg, transparent 180deg 360deg);
  }

  .status-btn.done {
    border-color: var(--good);
    background: var(--good);
  }

  .status-btn.done::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border-right: 2px solid var(--good-soft);
    border-bottom: 2px solid var(--good-soft);
    transform: rotate(40deg);
  }

  .task-main { flex: 1; min-width: 0; }

  .task-title {
    font-size: 14.5px;
    font-weight: 500;
    word-wrap: break-word;
  }

  .task.done .task-title {
    color: var(--ink-faint);
    text-decoration: line-through;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 5px;
    letter-spacing: 0.02em;
  }

  .chip.due { background: var(--paper-3); color: var(--ink-soft); }
  .chip.due.today { background: var(--warn-soft); color: var(--warn); }
  .chip.due.overdue { background: var(--critical-soft); color: var(--critical); }
  .chip.due.doing { background: var(--accent-soft); color: var(--accent); }

  .chip.pri-alta { background: var(--critical-soft); color: var(--critical); }
  .chip.pri-media { background: var(--warn-soft); color: var(--warn); }
  .chip.pri-baja { background: var(--paper-3); color: var(--ink-soft); }

  .chip.type-recurrente { background: var(--accent-soft); color: var(--accent); }
  .chip.type-puntual { background: var(--paper-3); color: var(--ink-soft); }
  .chip.type-seguimiento { background: var(--good-soft); color: var(--good); }
  .chip.neutral { background: var(--paper-3); color: var(--ink-soft); }

  .wd-btn { min-width: 30px; text-align: center; }

  .chip-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .chip-field-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
  }
  .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-btn {
    border: 1px solid transparent;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    opacity: 0.5;
  }
  .chip-btn:hover { opacity: 0.8; }
  .chip-btn.active { opacity: 1; border-color: currentColor; }

  /* ---------- Custom date picker (.dsel) — replaces the native date picker ---------- */
  .dsel { position: relative; width: 100%; }
  .dsel-native { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; overflow: hidden; }
  .dsel-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 14px; text-align: left; font-family: 'IBM Plex Mono', monospace;
  }
  .dsel-trigger .dsel-label.ph { color: var(--ink-faint); font-family: 'IBM Plex Sans', sans-serif; }
  .dsel-trigger svg { flex: none; width: 16px; height: 16px; color: var(--ink-faint); }
  .dsel-panel {
    display: none; position: absolute; z-index: 60; top: calc(100% + 6px); left: 0; min-width: 260px;
    max-width: calc(100vw - 24px); box-sizing: border-box;
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px;
  }
  .dsel-panel.show { display: block; }
  .dsel-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .dsel-panel-label { font-weight: 700; font-size: 13.5px; font-family: 'Archivo', sans-serif; }
  .dsel-nav { display: flex; gap: 4px; }
  .dsel-nav button { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); cursor: pointer; }
  .dsel-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
  .dsel-weekdays span { text-align: center; font-size: 10.5px; color: var(--ink-faint); font-weight: 600; }
  .dsel-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dsel-day { border: none; background: transparent; border-radius: 8px; padding: 6px 0; font-size: 12.5px; color: var(--ink); cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
  .dsel-day:hover { background: var(--paper); }
  .dsel-day.other-month { color: var(--ink-faint); }
  .dsel-day.today { box-shadow: inset 0 0 0 1px var(--line); }
  .dsel-day.selected { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .dsel-panel-foot { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .dsel-panel-foot button { border: none; background: none; color: var(--accent); font-size: 12.5px; font-weight: 700; padding: 4px 6px; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; }

  .msel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .msel-month {
    border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 10px 0;
    font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; color: var(--ink); cursor: pointer;
  }
  .msel-month:hover { border-color: var(--accent); }
  .msel-month.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  .qsel-options { display: flex; gap: 8px; }
  .qsel-opt {
    flex: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 12px 8px;
    font-size: 12.5px; font-weight: 600; color: var(--ink); cursor: pointer; text-align: center; font-family: 'IBM Plex Sans', sans-serif;
  }
  .qsel-opt:hover { border-color: var(--accent); }
  .qsel-opt.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .qsel-range { font-weight: 400; font-size: 11px; opacity: 0.8; }

  /* ---------- Vincular con pendencia de Planes ---------- */
  .pendencia-link-btn {
    display: block; width: 100%; text-align: left; padding: 9px 11px; border-radius: 7px;
    border: 1px dashed var(--line); background: var(--paper); color: var(--ink-soft);
    font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; cursor: pointer;
  }
  .pendencia-link-btn:hover { border-color: var(--accent); color: var(--ink); }
  .pendencia-link-btn.linked { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
  .pendencia-link-btn .unlink-x { float: right; color: var(--critical); font-weight: 700; }

  /* ---------- Modales (overlay) ---------- */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(20, 20, 20, 0.45); align-items: flex-start;
    justify-content: center; padding: 8vh 16px; z-index: 150; overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--paper-raised); border-radius: 14px; width: 100%; max-width: 460px; box-shadow: var(--shadow); overflow: hidden;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { font-family: 'Archivo', sans-serif; font-size: 16px; margin: 0; color: var(--ink); }
  .modal-close { background: none; border: none; font-size: 18px; color: var(--ink-faint); padding: 4px; cursor: pointer; }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .modal-body input[type="text"] { width: 100%; }
  .modal-foot { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .item-row { padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: var(--paper-2); }
  .item-row .row-title { font-weight: 600; color: var(--ink); }
  .item-row .row-meta { color: var(--ink-faint); font-size: 11.5px; display: block; margin-top: 2px; }

  /* ---------- Íconos por tipo de tarea ---------- */
  .type-icon { display: inline-flex; width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; flex: none; }
  .type-icon svg { width: 100%; height: 100%; display: block; }

  .task-notes {
    margin-top: 6px;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: pre-wrap;
  }

  .task-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 5px;
    line-height: 1;
  }

  .icon-btn:hover { background: var(--paper-3); color: var(--ink); }

  .edit-form {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .edit-form .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .edit-form input[type="text"] { flex: 1; min-width: 160px; }
  .edit-form textarea { width: 100%; height: 50px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; }

  .edit-form .save-btn {
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 12.5px;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    align-self: flex-start;
  }

  .empty {
    padding: 34px 10px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13.5px;
  }

  .log-toggle {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 5px 0 0;
    display: block;
  }

  .log-toggle:hover { color: var(--ink-soft); }

  .task-log {

<script>
(function(){
  function $(id){ return document.getElementById(id); }

  var PRIORITY_LABEL = { baja: 'Baja', media: 'Media', alta: 'Alta' };
  var TYPE_LABEL = { recurrente: 'Recurrente', puntual: 'Puntual', seguimiento: 'Seguimiento' };
  var TYPE_ICON = {
    recurrente: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>',
    puntual: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="8"/></svg>',
    seguimiento: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg>',
  };
  function typeChipInnerHtml(type) {
    return '<span class="type-icon">' + (TYPE_ICON[type] || '') + '</span>' + (TYPE_LABEL[type] || type);
  }
  var TABS = [
    { id: 'todas', label: 'Todas' },
    { id: 'pendiente', label: 'Pendientes' },
    { id: 'doing', label: 'En curso' },
    { id: 'done', label: 'Hechas' },
  ];
  var activeTab = 'todas';
  var tasks = [];
  var showCalendar = false;
  var calMonth = new Date();
  var selectedCalDay = null;
  var openEditId = null;
  var openLogId = null;
  var openSubtasksId = null;

  // ---------- Supabase client (mesmo projeto/anon key do Finanças e Planes) ----------
  var SUPABASE_URL = "https://qdetwdneqncblxwylpyw.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_CI3FY5MplWpHWaU25bewZg_l2YvjsmZ";
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showError(msg){ var e = $("errorBanner"); if (e){ e.textContent = msg; e.classList.add("show"); } }
  function clearError(){ var e = $("errorBanner"); if (e) e.classList.remove("show"); }
  function throwIfError(res){ if (res && res.error) throw res.error; return res; }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function fmtDue(dueDate, status, type) {
    if (!dueDate) return null;
    var parts = dueDate.split('-');
    // Una tarea recurrente no tiene "vencimiento": la fecha es solo el inicio de la repetición.
    if (type === 'recurrente') {
      return { text: parts[2] + '/' + parts[1], cls: 'due' };
    }
    var today = todayStr();
    var cls = 'due';
    if (dueDate < today) {
      // Una tarea "en curso" no se marca como atrasada: se está trabajando en ella.
      cls = status === 'doing' ? 'due doing' : 'due overdue';
    } else if (dueDate === today) {
      cls = 'due today';
    }
    return { text: parts[2] + '/' + parts[1], cls: cls };
  }

  function renderClock() {
    var now = new Date();
    var days = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
    var el = $('clock');
    el.textContent = days[now.getDay()] + ' ' + String(now.getDate()).padStart(2,'0') + '/' + String(now.getMonth()+1).padStart(2,'0');
  }
  renderClock();
  setInterval(renderClock, 60000);

  function renderTabs() {
    var counts = { todas: tasks.length, pendiente: 0, doing: 0, done: 0 };
    tasks.forEach(function(t){ if (counts[t.status] !== undefined) counts[t.status]++; });
    var el = $('tabs');
    el.innerHTML = '';
    TABS.forEach(function(tab){
      var btn = document.createElement('button');
      btn.className = 'tab' + (tab.id === activeTab ? ' active' : '');
      btn.innerHTML = tab.label + ' <span class="count">' + counts[tab.id] + '</span>';
      btn.onclick = function(){ activeTab = tab.id; renderTabs(); renderList(); };
      el.appendChild(btn);
    });
  }

  function renderStats() {
    var today = todayStr();
    var pending = tasks.filter(function(t){ return t.status !== 'done'; }).length;
    var overdue = tasks.filter(function(t){ return t.status === 'pending' && t.dueDate && t.dueDate < today; }).length;
    var doneToday = tasks.filter(function(t){ return t.status === 'done' && t.completedAt && t.completedAt.slice(0,10) === today; }).length;
    $('stat-pending').textContent = pending;
    $('stat-overdue').textContent = overdue;
    $('stat-done-today').textContent = doneToday;
  }

  function sortTasks(list) {
    var pri = { alta: 0, media: 1, baja: 2 };
    return list.slice().sort(function(a, b){
      if ((a.status === 'done') !== (b.status === 'done')) return a.status === 'done' ? 1 : -1;
      if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
      if (a.dueDate && !b.dueDate) return -1;
      if (!a.dueDate && b.dueDate) return 1;
      if (pri[a.priority] !== pri[b.priority]) return pri[a.priority] - pri[b.priority];
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
  }

  function cycleStatus(t) {
    if (t.status === 'pending') return 'doing';
    if (t.status === 'doing') return 'done';
    return 'pending';
  }

  // ---------- Chip selectors (prioridad / tipo) ----------
  function wireChipGroup(container, hiddenInput, onChange) {
    if (!container || !hiddenInput) return;
    container.querySelectorAll('.chip-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        container.querySelectorAll('.chip-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        hiddenInput.value = btn.getAttribute('data-value');
        if (onChange) onChange(hiddenInput.value);
      });
    });
  }
  function setChipGroupValue(container, value) {
    if (!container) return;
    container.querySelectorAll('.chip-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-value') === value);
    });
  }
  function wireMultiChipGroup(container, hiddenInput) {
    if (!container || !hiddenInput) return;
    container.querySelectorAll('.chip-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.classList.toggle('active');
        var vals = Array.prototype.map.call(container.querySelectorAll('.chip-btn.active'), function(b){ return b.getAttribute('data-value'); });
        hiddenInput.value = vals.join(',');
      });
    });
  }
  function setMultiChipGroupValue(container, valuesCsv) {
    if (!container) return;
    var vals = String(valuesCsv || '').split(',').filter(Boolean);
    container.querySelectorAll('.chip-btn').forEach(function(b){
      b.classList.toggle('active', vals.indexOf(b.getAttribute('data-value')) !== -1);
    });
  }

  // ---------- Visibility rules: seguimiento has no date, recurrente has a start date + repeat rule ----------
  function applyRecurrenceDateWidget(scope, recurrenceType) {
    var dselWrap = scope.querySelector('.due-field .dsel');
    var mselWrap = scope.querySelector('.due-field .msel:not(.qsel)');
    var qselWrap = scope.querySelector('.due-field .qsel');
    var weekdayGroup = scope.querySelector('.recurrence-weekday-chips');
    if (dselWrap) dselWrap.style.display = (!recurrenceType || recurrenceType === 'semanal') ? '' : 'none';
    if (mselWrap) mselWrap.style.display = recurrenceType === 'mensual' ? '' : 'none';
    if (qselWrap) qselWrap.style.display = recurrenceType === 'quincenal' ? '' : 'none';
    if (weekdayGroup) weekdayGroup.style.display = (recurrenceType === 'semanal') ? '' : 'none';
  }
  // La fecha de inicio de una tarea recurrente solo se muestra una vez elegido el modo de
  // repetición (y con el selector adecuado a esa granularidad: día exacto / quincena / mes).
  function applyTypeVisibility(scope, type) {
    var dueField = scope.querySelector('.due-field');
    var dueLabel = scope.querySelector('.due-field-label');
    var recField = scope.querySelector('.recurrence-field');
    if (!dueField || !recField) return;
    if (type === 'seguimiento') {
      dueField.style.display = 'none';
      recField.style.display = 'none';
    } else if (type === 'recurrente') {
      recField.style.display = '';
      var recTypeInput = scope.querySelector('.recurrence-type-input');
      var recType = recTypeInput ? recTypeInput.value : '';
      if (recType) {
        dueField.style.display = '';
        if (dueLabel) dueLabel.textContent = 'Fecha de inicio';
        applyRecurrenceDateWidget(scope, recType);
      } else {
        dueField.style.display = 'none';
      }
    } else {
      dueField.style.display = '';
      if (dueLabel) dueLabel.textContent = 'Fecha límite';
      recField.style.display = 'none';
      applyRecurrenceDateWidget(scope, null);
    }
  }

  // ---------- Filtro por período (semana/mes) ----------
  var activePeriod = 'todas';
  function isoFromDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseIsoDate(iso) { return new Date(iso + 'T00:00:00'); }
  function startOfWeek(d) { var x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; }
  function getPeriodRange(key) {
    var now = new Date(); now.setHours(0,0,0,0);
    if (key === 'semana') {
      var s = startOfWeek(now); var e = new Date(s); e.setDate(e.getDate() + 6);
      return [isoFromDate(s), isoFromDate(e)];
    }
    if (key === 'semana_prox') {
      var s2 = startOfWeek(now); s2.setDate(s2.getDate() + 7); var e2 = new Date(s2); e2.setDate(e2.getDate() + 6);
      return [isoFromDate(s2), isoFromDate(e2)];
    }
    if (key === 'mes') {
      var s3 = new Date(now.getFullYear(), now.getMonth(), 1); var e3 = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      return [isoFromDate(s3), isoFromDate(e3)];
    }
    if (key === 'mes_prox') {
      var s4 = new Date(now.getFullYear(), now.getMonth() + 1, 1); var e4 = new Date(now.getFullYear(), now.getMonth() + 2, 0);
      return [isoFromDate(s4), isoFromDate(e4)];
    }
    return null;
  }
  // Fechas (ISO) en las que cae una tarea dentro de [rangeStart, rangeEnd] — para tareas puntuales
  // es su propia fecha (si cae en el rango); para recurrentes, expande la regla de repetición.
  function occurrenceDatesInRange(t, rangeStart, rangeEnd) {
    if (t.type === 'seguimiento') {
      // Sin fecha propia: solo "existe" en el día de hoy, para chequearla constantemente.
      var today = todayStr();
      return (today >= rangeStart && today <= rangeEnd) ? [today] : [];
    }
    if (t.type !== 'recurrente') {
      return (t.dueDate && t.dueDate >= rangeStart && t.dueDate <= rangeEnd) ? [t.dueDate] : [];
    }
    if (!t.dueDate || t.dueDate > rangeEnd) return [];
    var freq = t.recurrenceType || 'semanal';
    var start = parseIsoDate(t.dueDate);
    var rs = parseIsoDate(rangeStart), re = parseIsoDate(rangeEnd);
    var dates = [];
    if (freq === 'mensual') {
      var day = start.getDate();
      var cur = new Date(rs.getFullYear(), rs.getMonth(), 1);
      while (cur <= re) {
        var daysInMonth = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
        var occ = new Date(cur.getFullYear(), cur.getMonth(), Math.min(day, daysInMonth));
        if (occ >= start && occ >= rs && occ <= re) dates.push(isoFromDate(occ));
        cur.setMonth(cur.getMonth() + 1);
      }
    } else if (freq === 'quincenal') {
      var diffDays = Math.round((rs - start) / 86400000);
      var k = Math.max(0, Math.ceil(diffDays / 15));
      for (var i = 0; i < 80; i++) {
        var occDate = new Date(start.getTime() + (k + i) * 15 * 86400000);
        if (occDate > re) break;
        if (occDate >= rs) dates.push(isoFromDate(occDate));
      }
    } else {
      // semanal: repite en los días de semana elegidos (por defecto, el día de la fecha de inicio)
      var weekdays = (t.recurrenceWeekdays && t.recurrenceWeekdays.length) ? t.recurrenceWeekdays : [start.getDay()];
      var cursor = new Date(Math.max(start.getTime(), rs.getTime()));
      while (cursor <= re) {
        if (weekdays.indexOf(cursor.getDay()) !== -1) dates.push(isoFromDate(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }
    }
    return dates;
  }
  function taskMatchesPeriod(t, range) {
    if (!range) return true;
    if (t.type === 'seguimiento') return true;
    return occurrenceDatesInRange(t, range[0], range[1]).length > 0;
  }
  function recurrenceLabel(t) {
    var freq = t.recurrenceType || 'semanal';
    if (freq === 'mensual') return 'Mensual';
    if (freq === 'quincenal') return 'Cada 15 días';
    var wds = (t.recurrenceWeekdays && t.recurrenceWeekdays.length) ? t.recurrenceWeekdays.slice().sort() : null;
    if (!wds) return 'Semanal';
    return 'Semanal (' + wds.map(function(d){ return WEEKDAY_LABELS[d]; }).join('') + ')';
  }

  // ---------- Custom date picker (.dsel) — replaces the native date picker ----------
  var MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var CAL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function ymdToIso(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
  function isoToES(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    return m ? (m[3] + '/' + m[2] + '/' + m[1]) : '';
  }

  function clampPanelToViewport(panel) {
    panel.style.left = '0px';
    var rect = panel.getBoundingClientRect();
    var margin = 8;
    var overflowRight = rect.right - (window.innerWidth - margin);
    if (overflowRight > 0) { panel.style.left = (-overflowRight) + 'px'; }
    var rect2 = panel.getBoundingClientRect();
    if (rect2.left < margin) { panel.style.left = (parseFloat(panel.style.left) || 0) + (margin - rect2.left) + 'px'; }
  }

  function enhanceDateInput(input) {
    if (!input || input.dataset.dselDone) return;
    input.dataset.dselDone = '1';

    var wrap = document.createElement('div');
    wrap.className = 'dsel';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    input.classList.add('dsel-native');
    input.tabIndex = -1;

    var trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'dsel-trigger';
    trigger.setAttribute('aria-expanded', 'false');
    trigger.innerHTML = '<span class="dsel-label ph">Seleccionar fecha</span>' + CAL_ICON;
    wrap.appendChild(trigger);

    var panel = document.createElement('div');
    panel.className = 'dsel-panel';
    wrap.appendChild(panel);

    var labelEl = trigger.querySelector('.dsel-label');
    var viewY = null, viewM = null;
    var nativeDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');

    function syncLabel() {
      var v = nativeDesc.get.call(input);
      if (v) { labelEl.textContent = isoToES(v); labelEl.classList.remove('ph'); }
      else { labelEl.textContent = 'Seleccionar fecha'; labelEl.classList.add('ph'); }
    }

    Object.defineProperty(input, 'value', {
      get: function(){ return nativeDesc.get.call(input); },
      set: function(v){
        nativeDesc.set.call(input, v);
        syncLabel();
        if (panel.classList.contains('show')) { viewY = null; viewM = null; renderPanel(); }
      },
      configurable: true,
    });

    function renderPanel() {
      var v = nativeDesc.get.call(input);
      var base = v ? new Date(v + 'T00:00:00') : new Date();
      if (viewY == null) { viewY = base.getFullYear(); viewM = base.getMonth(); }
      var first = new Date(viewY, viewM, 1);
      var startOffset = first.getDay();
      var daysInMonth = new Date(viewY, viewM + 1, 0).getDate();
      var daysInPrevMonth = new Date(viewY, viewM, 0).getDate();
      var todayIso = todayStr();
      var totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
      var cells = '';
      for (var i = 0; i < totalCells; i++) {
        var dayNum = i - startOffset + 1;
        var cellY = viewY, cellM = viewM, cellD = dayNum, otherMonth = false;
        if (dayNum < 1) { cellM = viewM - 1; cellD = daysInPrevMonth + dayNum; otherMonth = true; if (cellM < 0) { cellM = 11; cellY--; } }
        else if (dayNum > daysInMonth) { cellD = dayNum - daysInMonth; cellM = viewM + 1; otherMonth = true; if (cellM > 11) { cellM = 0; cellY++; } }
        var iso = ymdToIso(cellY, cellM, cellD);
        var cls = 'dsel-day' + (otherMonth ? ' other-month' : '') + (iso === todayIso ? ' today' : '') + (iso === v ? ' selected' : '');
        cells += '<button type="button" class="' + cls + '" data-iso="' + iso + '">' + cellD + '</button>';
      }
      panel.innerHTML =
        '<div class="dsel-panel-head"><span class="dsel-panel-label">' + MESES_ES[viewM] + ' ' + viewY + '</span>' +
        '<div class="dsel-nav"><button type="button" class="dsel-prev">‹</button><button type="button" class="dsel-next">›</button></div></div>' +
        '<div class="dsel-weekdays">' + WEEKDAY_LABELS.map(function(l){ return '<span>' + l + '</span>'; }).join('') + '</div>' +
        '<div class="dsel-days">' + cells + '</div>' +
        '<div class="dsel-panel-foot"><button type="button" class="dsel-today">Hoy</button><button type="button" class="dsel-clear">Limpiar</button></div>';

      panel.querySelector('.dsel-prev').addEventListener('click', function(){ viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderPanel(); });
      panel.querySelector('.dsel-next').addEventListener('click', function(){ viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderPanel(); });
      panel.querySelector('.dsel-today').addEventListener('click', function(){
        input.value = todayStr();
        input.dispatchEvent(new Event('change', { bubbles: true }));
        closePanel();
      });
      panel.querySelector('.dsel-clear').addEventListener('click', function(){
        input.value = '';
        input.dispatchEvent(new Event('change', { bubbles: true }));
        closePanel();
      });
      Array.prototype.forEach.call(panel.querySelectorAll('.dsel-day'), function(btn){
        btn.addEventListener('click', function(){
          input.value = btn.dataset.iso;
          input.dispatchEvent(new Event('change', { bubbles: true }));
          closePanel();
        });
      });
    }

    function openPanel() {
      document.querySelectorAll('.dsel-panel.show').forEach(function(p){ if (p !== panel) p.classList.remove('show'); });
      document.querySelectorAll('.dsel-trigger[aria-expanded="true"]').forEach(function(b){ if (b !== trigger) b.setAttribute('aria-expanded', 'false'); });
      viewY = null; viewM = null;
      renderPanel();
      panel.classList.add('show');
      trigger.setAttribute('aria-expanded', 'true');
      clampPanelToViewport(panel);
    }
    function closePanel() { panel.classList.remove('show'); trigger.setAttribute('aria-expanded', 'false'); }

    trigger.addEventListener('click', function(e){
      e.stopPropagation();
      if (panel.classList.contains('show')) closePanel(); else openPanel();
    });

    syncLabel();
  }

  var MES_ABBR_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  // ---------- Selector de mes (recurrencia mensual: solo importa el mes de inicio) ----------
  function createMonthSelector(input, mountEl) {

    wrap.appendChild(panel);

    var labelEl = trigger.querySelector('.dsel-label');

      if (viewY == null) viewY = curY != null ? curY : new Date().getFullYear();
      var grid = MES_ABBR_ES.map(function(name, idx){
        var sel = (curY === viewY && curM === idx);
        return '<button type="button" class="msel-month' + (sel ? ' selected' : '') + '" data-m="' + idx + '">' + name + '</button>';
      }).join('');
      panel.innerHTML =
        '<div class="dsel-panel-head"><span class="dsel-panel-label">' + viewY + '</span>' +
        '<div class="dsel-nav"><button type="button" class="dsel-prev">‹</button><button type="button" class="dsel-next">›</button></div></div>' +
        '<div class="msel-grid">' + grid + '</div>';
      panel.querySelector('.dsel-prev').addEventListener('click', function(){ viewY--; renderPanel(); });
      panel.querySelector('.dsel-next').addEventListener('click', function(){ viewY++; renderPanel(); });
      panel.querySelectorAll('.msel-month').forEach(function(btn){
        btn.addEventListener('click', function(){
          input.value = viewY + '-' + pad2(Number(btn.getAttribute('data-m')) + 1) + '-01';
          input.dispatchEvent(new Event('change', { bubbles: true }));
          syncLabel();
          closePanel();
        });
      });
    }

    function openPanel() {
      document.querySelectorAll('.dsel-panel.show').forEach(function(p){ if (p !== panel) p.classList.remove('show'); });
      document.querySelectorAll('.dsel-trigger[aria-expanded="true"]').forEach(function(b){ if (b !== trigger) b.setAttribute('aria-expanded', 'false'); });
      viewY = null;
      renderPanel();
      panel.classList.add('show');
      trigger.setAttribute('aria-expanded', 'true');
      clampPanelToViewport(panel);
    }
    function closePanel() { panel.classList.remove('show'); trigger.setAttribute('aria-expanded', 'false'); }
    trigger.addEventListener('click', function(e){ e.stopPropagation(); if (panel.classList.contains('show')) closePanel(); else openPanel(); });

    syncLabel();
    return wrap;
  }

  // ---------- Selector de quincena (recurrencia cada 15 días: mes + primera/segunda mitad) ----------
  function createQuincenaSelector(input, mountEl) {
    var wrap = document.createElement('div');
    wrap.className = 'dsel msel qsel';
    mountEl.appendChild(wrap);

    var trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'dsel-trigger';
    trigger.setAttribute('aria-expanded', 'false');
    trigger.innerHTML = '<span class="dsel-label ph">Seleccionar quincena</span>' + CAL_ICON;
    wrap.appendChild(trigger);

    var panel = document.createElement('div');
    panel.className = 'dsel-panel';
    wrap.appendChild(panel);

    var labelEl = trigger.querySelector('.dsel-label');
    var viewY = null, viewM = null;

    function parseVal() {
      var v = input.value;
      var m = v ? /^(\d{4})-(\d{2})-(\d{2})/.exec(v) : null;
      if (!m) return null;
      return { y: Number(m[1]), m: Number(m[2]) - 1, half: Number(m[3]) >= 16 ? 2 : 1 };
    }

    function syncLabel() {
      var cur = parseVal();
      if (cur) {
        labelEl.textContent = (cur.half === 2 ? '2ª' : '1ª') + ' quincena · ' + MESES_ES[cur.m] + ' ' + cur.y;
        labelEl.classList.remove('ph');
      } else {
        labelEl.textContent = 'Seleccionar quincena';
        labelEl.classList.add('ph');
      }
    }

    function renderPanel() {
      var cur = parseVal();
      if (viewY == null) { viewY = cur ? cur.y : new Date().getFullYear(); viewM = cur ? cur.m : new Date().getMonth(); }
      var sel1 = cur && cur.y === viewY && cur.m === viewM && cur.half === 1;
      var sel2 = cur && cur.y === viewY && cur.m === viewM && cur.half === 2;
      panel.innerHTML =
        '<div class="dsel-panel-head"><span class="dsel-panel-label">' + MESES_ES[viewM] + ' ' + viewY + '</span>' +
        '<div class="dsel-nav"><button type="button" class="dsel-prev">‹</button><button type="button" class="dsel-next">›</button></div></div>' +
        '<div class="qsel-options">' +
          '<button type="button" class="qsel-opt' + (sel1 ? ' selected' : '') + '" data-half="1">1ª quincena<br><span class="qsel-range">(1–15)</span></button>' +
          '<button type="button" class="qsel-opt' + (sel2 ? ' selected' : '') + '" data-half="2">2ª quincena<br><span class="qsel-range">(16–fin)</span></button>' +
        '</div>';
      panel.querySelector('.dsel-prev').addEventListener('click', function(){ viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderPanel(); });
      panel.querySelector('.dsel-next').addEventListener('click', function(){ viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderPanel(); });
      panel.querySelectorAll('.qsel-opt').forEach(function(btn){
        btn.addEventListener('click', function(){
          var half = Number(btn.getAttribute('data-half'));
          input.value = viewY + '-' + pad2(viewM + 1) + '-' + pad2(half === 2 ? 16 : 1);
          input.dispatchEvent(new Event('change', { bubbles: true }));
          syncLabel();
          closePanel();
        });
      });
    }

    function openPanel() {
      document.querySelectorAll('.dsel-panel.show').forEach(function(p){ if (p !== panel) p.classList.remove('show'); });
      document.querySelectorAll('.dsel-trigger[aria-expanded="true"]').forEach(function(b){ if (b !== trigger) b.setAttribute('aria-expanded', 'false'); });
      viewY = null; viewM = null;
      renderPanel();
      panel.classList.add('show');
      trigger.setAttribute('aria-expanded', 'true');
      clampPanelToViewport(panel);
    }
    function closePanel() { panel.classList.remove('show'); trigger.setAttribute('aria-expanded', 'false'); }
    trigger.addEventListener('click', function(e){ e.stopPropagation(); if (panel.classList.contains('show')) closePanel(); else openPanel(); });

    syncLabel();
    return wrap;
  }

  document.addEventListener('click', function(e){
    var path = typeof e.composedPath === 'function' ? e.composedPath() : [];
    var insidePicker = path.some(function(el){ return el && el.classList && el.classList.contains('dsel'); });
    if (!insidePicker) {
      document.querySelectorAll('.dsel-panel.show').forEach(function(p){ p.classList.remove('show'); });
      document.querySelectorAll('.dsel-trigger[aria-expanded="true"]').forEach(function(b){ b.setAttribute('aria-expanded', 'false'); });
    }

      document.querySelectorAll('.dsel-panel.show').forEach(function(p){ p.classList.remove('show'); });

  // ---------- Data layer (Supabase: tabela tareas_tasks, RLS por user_id) ----------
  function mapRow(r) {
    return {
      id: r.id,
      title: r.title,
      notes: r.notes || '',
      priority: r.priority,
      type: r.task_type || 'puntual',
      recurrenceType: r.recurrence_type,
      recurrenceWeekdays: Array.isArray(r.recurrence_weekdays) ? r.recurrence_weekdays : [],
      dueDate: r.due_date,
      status: r.status,
      log: Array.isArray(r.log) ? r.log : [],
      subtasks: Array.isArray(r.subtasks) ? r.subtasks : [],
      createdAt: r.created_at,
      updatedAt: r.updated_at,
      completedAt: r.completed_at,
      pendenciaId: r.planes_pendencia_id || null,
      pendenciaTexto: null,
      pendenciaFeito: false,
    };
  }

  function loadTasks() {
    return supabaseClient.from('tareas_tasks').select('*').order('created_at', { ascending: true }).then(function(res){
      throwIfError(res);
      tasks = (res.data || []).map(mapRow);
      var ids = tasks.filter(function(t){ return t.pendenciaId; }).map(function(t){ return t.pendenciaId; });
      if (!ids.length) return;
      return supabaseClient.from('planes_pendencias').select('id, texto, feito').in('id', ids).then(function(res2){
        throwIfError(res2);
        var map = {};
        (res2.data || []).forEach(function(p){ map[p.id] = p; });
        tasks.forEach(function(t){
          if (t.pendenciaId && map[t.pendenciaId]) {
            t.pendenciaTexto = map[t.pendenciaId].texto;
            t.pendenciaFeito = !!map[t.pendenciaId].feito;
          }
        });
      });
    });
  }

  function loadAndRender() {
    clearError();
    return loadTasks().then(renderAll).catch(function(err){
      showError('No se pudo cargar tus tareas: ' + err.message);
    });
  }

  function addTask() {
    var titleInput = $('title-input');
    var title = titleInput.value.trim();
    if (!title) return;
    var priority = $('priority-input').value;
    var type = $('type-input').value;
    var dueDate = $('due-input').value || null;
    var notes = $('notes-input').value.trim() || null;
    if (type === 'seguimiento') dueDate = null;
    var recurrenceType = null, recurrenceWeekdays = null;
    if (type === 'recurrente') {
      recurrenceType = $('recurrence-type-input').value || 'semanal';
      if (recurrenceType === 'semanal') {
        var wdCsv = $('recurrence-weekdays-input').value;
        recurrenceWeekdays = wdCsv ? wdCsv.split(',').map(Number) : [dueDate ? parseIsoDate(dueDate).getDay() : new Date().getDay()];
      }
    }
    var pendenciaVal = $('planes-pendencia-input').value;
    supabaseClient.from('tareas_tasks').insert({
      title: title, priority: priority, task_type: type, due_date: dueDate, notes: notes, status: 'pending',
      recurrence_type: recurrenceType, recurrence_weekdays: recurrenceWeekdays,
      planes_pendencia_id: pendenciaVal ? Number(pendenciaVal) : null,
    }).select().then(throwIfError).then(function(){
      titleInput.value = '';
      $('notes-input').value = '';
      $('due-input').value = '';
      $('priority-input').value = 'media';
      setChipGroupValue($('priority-chips'), 'media');
      $('type-input').value = 'puntual';
      setChipGroupValue($('type-chips'), 'puntual');
      $('recurrence-type-input').value = '';
      setChipGroupValue(document.querySelector('.recurrence-type-chips'), '');
      $('recurrence-weekdays-input').value = '';
      setMultiChipGroupValue(document.querySelector('.recurrence-weekday-chips'), '');
      $('planes-pendencia-input').value = '';
      updatePendenciaLinkBtn($('pendencia-link-btn'), '');
      applyTypeVisibility(document, 'puntual');
      $('add-btn').disabled = true;
      titleInput.focus();
      return loadAndRender();
    }).catch(function(err){ showError('No se pudo agregar la tarea: ' + err.message); });
  }

  function setStatus(id, status) {
    var patch = { status: status, updated_at: new Date().toISOString() };
    patch.completed_at = status === 'done' ? new Date().toISOString() : null;
    supabaseClient.from('tareas_tasks').update(patch).eq('id', id).then(throwIfError).then(loadAndRender)
      .catch(function(err){ showError('No se pudo actualizar la tarea: ' + err.message); });
  }

  function deleteTask(id) {
    showConfirm('¿Eliminar esta tarea?', 'Esta acción no se puede deshacer.').then(function(ok){
      if (!ok) return;
      supabaseClient.from('tareas_tasks').delete().eq('id', id).then(throwIfError).then(loadAndRender)
        .catch(function(err){ showError('No se pudo eliminar la tarea: ' + err.message); });
    });
  }

  function saveEdit(id, form) {
    var title = form.querySelector('.edit-title').value.trim();
    if (!title) return;
    var notes = form.querySelector('.edit-notes').value.trim() || null;
    var priority = form.querySelector('.edit-priority').value;
    var type = form.querySelector('.edit-type').value;
    var dueDate = form.querySelector('.edit-due').value || null;
    if (type === 'seguimiento') dueDate = null;
    var recurrenceType = null, recurrenceWeekdays = null;
    if (type === 'recurrente') {
      recurrenceType = form.querySelector('.edit-recurrence-type').value || 'semanal';
      if (recurrenceType === 'semanal') {
        var wdCsv = form.querySelector('.edit-recurrence-weekdays').value;
        recurrenceWeekdays = wdCsv ? wdCsv.split(',').map(Number) : [dueDate ? parseIsoDate(dueDate).getDay() : new Date().getDay()];
      }
    }
    var pendenciaVal = form.querySelector('.edit-planes-pendencia').value;
    supabaseClient.from('tareas_tasks').update({
      title: title, notes: notes, priority: priority, task_type: type, due_date: dueDate, updated_at: new Date().toISOString(),
      recurrence_type: recurrenceType, recurrence_weekdays: recurrenceWeekdays,
      planes_pendencia_id: pendenciaVal ? Number(pendenciaVal) : null,
    }).eq('id', id).then(throwIfError).then(function(){
      openEditId = null;
      return loadAndRender();
    }).catch(function(err){ showError('No se pudo guardar la edición: ' + err.message); });
  }

  function appendLog(id, text) {
    if (!text.trim()) return;
    var task = tasks.filter(function(x){ return x.id === id; })[0];
    var log = (task && Array.isArray(task.log)) ? task.log.slice() : [];
    log.push({ ts: new Date().toISOString(), text: text.trim() });
    supabaseClient.from('tareas_tasks').update({ log: log, updated_at: new Date().toISOString() }).eq('id', id)
      .then(throwIfError).then(loadAndRender)
      .catch(function(err){ showError('No se pudo agregar al historial: ' + err.message); });
  }

  // ---------- Subtareas (checklist dentro de una tarea) ----------
  function genLocalId() { return 'st' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function saveSubtasks(taskId, subtasks, errMsg) {
    supabaseClient.from('tareas_tasks').update({ subtasks: subtasks, updated_at: new Date().toISOString() }).eq('id', taskId)
      .then(throwIfError).then(loadAndRender)
      .catch(function(err){ showError(errMsg + ': ' + err.message); });
  }
  function addSubtask(taskId, title) {
    title = (title || '').trim();
    if (!title) return;
    var task = tasks.filter(function(x){ return x.id === taskId; })[0];
    if (!task) return;
    var subtasks = (Array.isArray(task.subtasks) ? task.subtasks : []).slice();
    subtasks.push({ id: genLocalId(), title: title, done: false });
    saveSubtasks(taskId, subtasks, 'No se pudo agregar la subtarea');
  }
  function toggleSubtask(taskId, subId) {
    var task = tasks.filter(function(x){ return x.id === taskId; })[0];
    if (!task) return;
    var subtasks = (Array.isArray(task.subtasks) ? task.subtasks : []).map(function(s){
      return s.id === subId ? { id: s.id, title: s.title, done: !s.done } : s;
    });
    saveSubtasks(taskId, subtasks, 'No se pudo actualizar la subtarea');
  }
  function deleteSubtask(taskId, subId) {
    var task = tasks.filter(function(x){ return x.id === taskId; })[0];
    if (!task) return;
    var subtasks = (Array.isArray(task.subtasks) ? task.subtasks : []).filter(function(s){ return s.id !== subId; });
    saveSubtasks(taskId, subtasks, 'No se pudo eliminar la subtarea');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  function fmtLogTs(ts) {
    var d = new Date(ts);
    if (isNaN(d)) return '';
    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // ---------- Confirmación (reemplaza el confirm() nativo del navegador) ----------
  var confirmResolve = null;
  function showConfirm(title, message) {
    return new Promise(function(resolve){
      confirmResolve = resolve;
      $('confirmTitle').textContent = title || 'Confirmar';
      $('confirmMessage').textContent = message || '';
      $('confirmOverlay').classList.add('show');
    });
  }
  function closeConfirm(result) {
    $('confirmOverlay').classList.remove('show');
    var resolve = confirmResolve;
    confirmResolve = null;
    if (resolve) resolve(result);
  }

  // ---------- Vincular con una pendencia de Planes ----------
  var pendenciasCache = null;
  var pendenciaLinkTarget = null;
  function loadPendenciasCache() {
    if (pendenciasCache) return Promise.resolve(pendenciasCache);
    return Promise.all([
      supabaseClient.from('planes_pendencias').select('id, texto, feito, trip_id, created_at').order('created_at', { ascending: false }),
      supabaseClient.from('planes_trip').select('id, nome, destino'),
    ]).then(function(results){
      throwIfError(results[0]); throwIfError(results[1]);
      var trips = {};
      (results[1].data || []).forEach(function(tr){ trips[tr.id] = tr.nome || tr.destino || ('Viaje #' + tr.id); });
      pendenciasCache = (results[0].data || []).map(function(p){
        return { id: p.id, texto: p.texto || '', feito: !!p.feito, tripLabel: trips[p.trip_id] || '' };
      });
      return pendenciasCache;
    });
  }
  function renderPendenciaListUI(filter) {
    var listEl = $('pendenciaList');
    listEl.innerHTML = '<div class="empty">Cargando...</div>';
    loadPendenciasCache().then(function(list){
      var f = (filter || '').trim().toLowerCase();
      var filtered = f ? list.filter(function(p){ return p.texto.toLowerCase().indexOf(f) !== -1 || p.tripLabel.toLowerCase().indexOf(f) !== -1; }) : list;
      listEl.innerHTML = '';
      if (!filtered.length) { listEl.innerHTML = '<div class="empty">Ninguna pendencia encontrada.</div>'; return; }
      filtered.slice(0, 100).forEach(function(p){
        var row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = '<span class="row-title">' + escapeHtml(p.texto) + '</span>' +
          '<span class="row-meta">' + (p.tripLabel ? escapeHtml(p.tripLabel) + ' · ' : '') + (p.feito ? 'Resuelta' : 'Pendiente') + '</span>';
        row.addEventListener('click', function(){ selectPendencia(p); });
        listEl.appendChild(row);
      });
    }).catch(function(err){
      listEl.innerHTML = '';
      $('pendenciaError').textContent = 'No se pudo cargar: ' + err.message;
      $('pendenciaError').classList.add('show');
    });
  }
  function openPendenciaPicker(target) {
    pendenciaLinkTarget = target;
    $('pendenciaError').classList.remove('show');
    $('pendenciaSearch').value = '';
    $('pendenciaOverlay').classList.add('show');
    renderPendenciaListUI('');
  }
  function closePendenciaPicker() { $('pendenciaOverlay').classList.remove('show'); }
  function updatePendenciaLinkBtn(btn, texto) {
    if (texto) {
      btn.classList.add('linked');
      btn.innerHTML = '🔗 ' + escapeHtml(texto) + ' <span class="unlink-x" data-unlink="1">✕</span>';
    } else {
      btn.classList.remove('linked');
      btn.innerHTML = '🔗 Vincular con una pendencia de Planes';
    }
  }
  function selectPendencia(p) {
    if (!pendenciaLinkTarget) return;
    pendenciaLinkTarget.inputEl.value = p.id;
    updatePendenciaLinkBtn(pendenciaLinkTarget.btnEl, p.texto);
    closePendenciaPicker();
  }
  function wirePendenciaLinkBtn(btn, inputEl) {
    btn.addEventListener('click', function(e){
      if (e.target && e.target.getAttribute && e.target.getAttribute('data-unlink')) {
        e.stopPropagation();
        inputEl.value = '';
        updatePendenciaLinkBtn(btn, '');
        return;
      }
      openPendenciaPicker({ inputEl: inputEl, btnEl: btn });
    });
  }

  var MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var WEEKDAY_LABELS = ['D','L','M','M','J','V','S'];

  function dateToKey(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function renderCalendar() {
    var el = $('calendar');
    if (!showCalendar) { el.hidden = true; return; }
    el.hidden = false;

    var year = calMonth.getFullYear();
    var month = calMonth.getMonth();
    var today = todayStr();

    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var monthStartIso = dateToKey(year, month, 1);
    var monthEndIso = dateToKey(year, month, daysInMonth);

    // Una tarea recurrente aparece como un punto en cada día del mes en que repite,
    // no solo en su fecha de inicio.
    var byDay = {};
    tasks.forEach(function(t){
      occurrenceDatesInRange(t, monthStartIso, monthEndIso).forEach(function(iso){
        if (!byDay[iso]) byDay[iso] = [];
        byDay[iso].push(t);
      });
    });

    var html = '<div class="cal-header">' +
      '<button class="cal-nav" id="cal-prev">‹</button>' +
      '<div class="cal-label">' + MONTH_NAMES[month] + ' ' + year + '</div>' +
      '<button class="cal-nav" id="cal-next">›</button>' +
      '</div>';

    html += '<div class="cal-grid">';
    WEEKDAY_LABELS.forEach(function(w){ html += '<div class="cal-weekday">' + w + '</div>'; });

    for (var i = 0; i < firstDow; i++) {
      html += '<div class="cal-day cal-blank"></div>';
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var key = dateToKey(year, month, d);
      var dayTasks = byDay[key] || [];
      var dotCls = '';
      if (dayTasks.length) {
        var hasOverdueActive = dayTasks.some(function(t){ return t.status === 'pending' && key < today; });
        var hasActive = dayTasks.some(function(t){ return t.status !== 'done'; });
        dotCls = hasOverdueActive ? 'cal-dot-critical' : (hasActive ? 'cal-dot-active' : 'cal-dot-done');
      }
      var cls = 'cal-day';
      if (key === today) cls += ' cal-today';
      if (key === selectedCalDay) cls += ' cal-selected';
      html += '<div class="' + cls + '" data-key="' + key + '">' + d +
        (dayTasks.length ? '<span class="cal-dot ' + dotCls + '"></span>' : '') +
        '</div>';
    }
    html += '</div>';

    if (selectedCalDay) {
      var dayTasks2 = byDay[selectedCalDay] || [];
      var parts = selectedCalDay.split('-');
      html += '<div class="cal-day-panel">' +
        '<div class="cal-day-panel-title">' + parts[2] + '/' + parts[1] + '/' + parts[0] + '</div>' +
        (dayTasks2.length === 0
          ? '<div class="log-empty">Sin tareas ese día.</div>'
          : sortTasks(dayTasks2).map(function(t){
              return '<div class="cal-task-row' + (t.status === 'done' ? ' done' : '') + '">' +
                '<span class="chip pri-' + t.priority + '">' + (PRIORITY_LABEL[t.priority] || t.priority) + '</span>' +
                '<span class="chip type-' + t.type + '">' + typeChipInnerHtml(t.type) + '</span>' +
                '<span class="cal-task-title">' + escapeHtml(t.title) + '</span>' +
              '</div>';
            }).join('')) +
        '</div>';
    }

    el.innerHTML = html;

    var prevBtn = $('cal-prev');
    var nextBtn = $('cal-next');
    if (prevBtn) prevBtn.onclick = function(){ calMonth = new Date(year, month - 1, 1); selectedCalDay = null; renderCalendar(); };
    if (nextBtn) nextBtn.onclick = function(){ calMonth = new Date(year, month + 1, 1); selectedCalDay = null; renderCalendar(); };
    el.querySelectorAll('.cal-day[data-key]').forEach(function(dayEl){
      dayEl.onclick = function(){
        var key = dayEl.getAttribute('data-key');
        selectedCalDay = selectedCalDay === key ? null : key;
        renderCalendar();
      };
    });
  }

  $('cal-toggle-btn').addEventListener('click', function(){
    showCalendar = !showCalendar;
    $('cal-toggle-btn').textContent = showCalendar ? '📅 Ocultar calendario' : '📅 Ver calendario';
    renderCalendar();
  });

  function renderAll() {
    renderTabs();
    renderStats();
    renderList();
    if (showCalendar) renderCalendar();
  }

  var captureEl = document.querySelector('.capture');
  captureEl.querySelectorAll('#type-chips .chip-btn').forEach(function(btn){
    btn.innerHTML = typeChipInnerHtml(btn.getAttribute('data-value'));
  });

  wireChipGroup($('priority-chips'), $('priority-input'));
  wireChipGroup($('type-chips'), $('type-input'), function(val){
    $('due-input').value = '';
    $('recurrence-type-input').value = '';
    setChipGroupValue(captureEl.querySelector('.recurrence-type-chips'), '');
    $('recurrence-weekdays-input').value = '';
    setMultiChipGroupValue(captureEl.querySelector('.recurrence-weekday-chips'), '');
    applyTypeVisibility(captureEl, val);
  });
  wireChipGroup(captureEl.querySelector('.recurrence-type-chips'), $('recurrence-type-input'), function(){
    $('due-input').value = '';
    setMultiChipGroupValue(captureEl.querySelector('.recurrence-weekday-chips'), '');
    applyTypeVisibility(captureEl, 'recurrente');
  });
  wireMultiChipGroup(captureEl.querySelector('.recurrence-weekday-chips'), $('recurrence-weekdays-input'));
  enhanceDateInput($('due-input'));
  createMonthSelector($('due-input'), $('due-input-extra'));
  createQuincenaSelector($('due-input'), $('due-input-extra'));
  applyTypeVisibility(captureEl, $('type-input').value);

  wireChipGroup($('period-chips'), $('period-input'), function(val){ activePeriod = val; renderList(); });

  wirePendenciaLinkBtn($('pendencia-link-btn'), $('planes-pendencia-input'));
  $('pendenciaClose').addEventListener('click', closePendenciaPicker);
  $('pendenciaCloseFoot').addEventListener('click', closePendenciaPicker);
  $('pendenciaSearch').addEventListener('input', function(){ renderPendenciaListUI(this.value); });

  $('confirmCancelBtn').addEventListener('click', function(){ closeConfirm(false); });
  $('confirmOkBtn').addEventListener('click', function(){ closeConfirm(true); });

  $('add-btn').addEventListener('click', addTask);
  $('title-input').addEventListener('input', function(e){
    $('add-btn').disabled = !e.target.value.trim();
  });
  $('title-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') addTask();
  });

  // ---------- Auth flow (Supabase email/password, mesmo padrão do Finanças/Planes) ----------
  function showAuthError(msg){ var e = $("authError"); e.textContent = msg; e.style.display = "block"; }
  function clearAuthError(){ $("authError").style.display = "none"; }

  function doSignIn(){
    clearAuthError();
    var email = $("authEmail").value.trim();
    var password = $("authPassword").value;
    if (!email || !password){ showAuthError("Informe email y contraseña."); return; }
    supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      if (res.error) showAuthError(res.error.message);
    });
  }
  function doSignUp(){
    clearAuthError();
    var email = $("authEmail").value.trim();
    var password = $("authPassword").value;
    if (!email || !password){ showAuthError("Informe email y contraseña."); return; }
    if (password.length < 6){ showAuthError("La contraseña debe tener al menos 6 caracteres."); return; }
    supabaseClient.auth.signUp({ email: email, password: password }).then(function(res){
      if (res.error){ showAuthError(res.error.message); return; }
      if (res.data && res.data.user && !res.data.session){
        showAuthError("¡Cuenta creada! Revisá tu email para confirmar antes de entrar.");
      }
    });
  }
  $("btnSignIn").addEventListener("click", doSignIn);
  $("btnSignUp").addEventListener("click", doSignUp);
  $("btnLogout").addEventListener("click", function(){ supabaseClient.auth.signOut(); });
  $("btnToggleSenha").addEventListener("click", function(){
    var input = $("authPassword");
    var showing = input.type === "text";
    input.type = showing ? "password" : "text";
    this.setAttribute("aria-label", showing ? "Mostrar contraseña" : "Ocultar contraseña");
  });
  ["authEmail","authPassword"].forEach(function(id){
    $(id).addEventListener("keydown", function(e){ if (e.key === "Enter") doSignIn(); });
  });

  var splashHidden = false;
  function hideSplash(){
    if (splashHidden) return;
    splashHidden = true;
    var el = $("splashView");
    if (!el) return;
    el.classList.add("hide");
    setTimeout(function(){ el.style.display = "none"; }, 250);
  }
  function setConnectedUI(connected, email){
    $("connDot").className = "conn-dot " + (connected ? "on" : "off");
    $("connLabel").textContent = connected ? ("Conectado como " + email) : "No conectado";
    $("notConnectedView").style.display = connected ? "none" : "block";
    $("connectedView").style.display = connected ? "block" : "none";
    hideSplash();
  }
  supabaseClient.auth.onAuthStateChange(function(event, session){
    if (session && session.user){
      setConnectedUI(true, session.user.email);
      loadAndRender();
    } else {
      setConnectedUI(false, "");
    }
  });

  // Android 15+ (API 35) desenha o WebView atrás da status bar por padrão — sem isso a barra
  // superior do app renderiza embaixo da faixa de notificações do telefone. Ver Planes/index.html.
  (function configureStatusBar(){
    if (!window.Capacitor || !window.Capacitor.isNativePlatform()) return;
    var StatusBar = window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar;
    if (!StatusBar) return;
    StatusBar.setOverlaysWebView({ overlay: false }).catch(function(){});
    StatusBar.setBackgroundColor({ color: "#3D5A80" }).catch(function(){});
    StatusBar.setStyle({ style: "DARK" }).catch(function(){});
  })();

  renderAll();
})();
</script>

</body>
</html>
